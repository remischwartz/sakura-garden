<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakura Garden - An Interactive 3D Japanese Garden</title>
    <meta
      name="description"
      content="Wander through an interactive 3D Japanese garden: cherry blossoms, a koi pond with rain ripples, and a forest, from day to winter night. Built with React Three Fiber."
    />
    <meta name="author" content="Rémi Schwartz" />
    <meta name="theme-color" content="#0b1026" />
    <link rel="canonical" href="https://remischwartz.github.io/sakura-garden/" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sakura Garden" />
    <meta property="og:title" content="Sakura Garden - An Interactive 3D Japanese Garden" />
    <meta
      property="og:description"
      content="Wander through an interactive 3D Japanese garden in each season, by day or night."
    />
    <meta property="og:url" content="https://remischwartz.github.io/sakura-garden/" />
    <meta property="og:image" content="https://remischwartz.github.io/sakura-garden/Garden_winter_night.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A snowy Japanese garden with a sakura tree and pond at winter night" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakura Garden - An Interactive 3D Japanese Garden" />
    <meta
      name="twitter:description"
      content="Wander through an interactive 3D Japanese garden: cherry blossoms, a koi pond with rain ripples, and a forest, from day to winter night."
    />
    <meta name="twitter:image" content="https://remischwartz.github.io/sakura-garden/Garden_winter_night.png" />
    <meta name="twitter:image:alt" content="A snowy Japanese garden with a sakura tree and pond at winter night" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sakura Garden",
        "url": "https://remischwartz.github.io/sakura-garden/",
        "description": "An interactive 3D Japanese garden with cherry blossoms, a pond and a forest.",
        "image": "https://remischwartz.github.io/sakura-garden/Garden_winter_night.png",
        "author": { "@type": "Person", "name": "Rémi Schwartz" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown while the JS bundle downloads; removed by LoadingScreen once React mounts. -->
    <div id="boot-loader" role="status" aria-label="Loading the garden">
      <style>
        #boot-loader {
          position: fixed;
          inset: 0;
          z-index: 100;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0b1026;
          color: #f1efe9;
          font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        #boot-loader .t {
          font-size: 1.4rem;
          font-weight: 500;
          letter-spacing: 0.08em;
        }
        #boot-loader .p {
          width: 28px;
          height: 28px;
          border-radius: 100% 0 100% 0;
          background: #f7b6cf;
          animation: boot-spin 1.6s ease-in-out infinite;
        }
        #boot-loader .b {
          width: 180px;
          height: 3px;
          border-radius: 2px;
          background: rgba(255, 255, 255, 0.15);
          overflow: hidden;
        }
        #boot-loader .b i {
          display: block;
          width: 35%;
          height: 100%;
          background: #f7b6cf;
          animation: boot-slide 1.2s ease-in-out infinite;
        }
        @keyframes boot-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes boot-slide {
          from { transform: translateX(-100%); }
          to { transform: translateX(290%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-loader .p, #boot-loader .b i { animation: none; }
        }
      </style>
      <div class="p"></div>
      <div class="t">Sakura Garden</div>
      <div class="b"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
